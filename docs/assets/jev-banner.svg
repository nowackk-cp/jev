<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
 <title id="title">Jev — Bir istek. Bir ekip. Canlı bir ofis.</title>
 <desc id="desc">Jev çok ajanlı yazılım ofisi. Opus planlar, Jev dağıtır, Sol ve Sonnet kodlar, Luna yardımcı olur.</desc>
 <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#191f27"/><stop offset="1" stop-color="#0f141b"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern></defs>
 <rect width="1280" height="440" rx="20" fill="url(#bg)"/><rect width="1280" height="440" rx="20" fill="url(#grid)"/>
 <circle cx="1150" cy="-40" r="230" fill="#e07a2e" opacity=".05"/>
 <g font-family="Segoe UI,Arial,sans-serif">
  <text x="68" y="68" font-size="12" font-weight="700" letter-spacing="4" fill="#e7a268">ÇOK AJANLI YAZILIM OFİSİ</text>
  <text x="63" y="172" font-size="100" font-weight="800" letter-spacing="-7" fill="#fffaf2">jev<tspan fill="#e07a2e">.</tspan></text>
  <text x="68" y="231" font-size="31" font-weight="600" letter-spacing="-.8" fill="#fffaf2">Bir istek. Bir ekip.</text>
  <text x="68" y="273" font-size="31" font-weight="600" letter-spacing="-.8" fill="#fffaf2">Canlı bir ofis.</text>
  <text x="68" y="316" font-size="16" fill="#9ba7b5">İsteğini anlat. Ekibin çalışmasını izle.</text>
  <rect x="68" y="350" width="308" height="34" rx="8" fill="#ffffff" opacity=".06"/>
  <text x="84" y="372" font-size="12" fill="#c2cbd5" font-family="Consolas,monospace">$ jev "birim dönüştürücü tasarla"</text>
  <g transform="translate(579 61)">
   <rect width="634" height="322" rx="14" fill="#202833" stroke="#394451"/>
   <path d="M0 42H634" stroke="#394451"/><circle cx="22" cy="21" r="4" fill="#e07a2e"/><circle cx="37" cy="21" r="4" fill="#e6b400"/><circle cx="52" cy="21" r="4" fill="#3a9d5d"/>
   <text x="84" y="25" font-size="12" fill="#a5b2c2">jev / ofis</text><circle cx="542" cy="21" r="3" fill="#63cc88"/><text x="553" y="25" font-size="11" fill="#63cc88">Canlı</text>
   <path d="M316 102V171M105 171H528M105 171V214M316 171V214M528 171V214" stroke="#526172" fill="none" stroke-width="2"/>
   <rect x="236" y="60" width="160" height="48" rx="9" fill="#293340" stroke="#697ba0"/>
   <text x="316" y="81" font-size="15" font-weight="700" text-anchor="middle" fill="#d0beff">Opus</text><text x="316" y="97" font-size="10" text-anchor="middle" fill="#a5b2c2">plan / sözleşmeler</text>
   <rect x="244" y="132" width="144" height="48" rx="9" fill="#3f3025" stroke="#e07a2e"/>
   <text x="316" y="153" font-size="15" font-weight="700" text-anchor="middle" fill="#ffb877">Jev</text><text x="316" y="169" font-size="10" text-anchor="middle" fill="#cfaa8a">dağıtım / doğrulama</text>
   <g text-anchor="middle"><rect x="38" y="212" width="134" height="65" rx="9" fill="#273b49" stroke="#377b99"/><text x="105" y="236" font-size="17" font-weight="700" fill="#79c7ec">Sol</text><text x="105" y="256" font-size="11" fill="#a5b2c2">kod + son kontrol</text>
    <rect x="249" y="212" width="134" height="65" rx="9" fill="#2c3c30" stroke="#4b815c"/><text x="316" y="236" font-size="17" font-weight="700" fill="#97d5a5">Sonnet</text><text x="316" y="256" font-size="11" fill="#a5b2c2">kod + test</text>
    <rect x="461" y="212" width="134" height="65" rx="9" fill="#3c3548" stroke="#7e659c"/><text x="528" y="236" font-size="17" font-weight="700" fill="#cdb0ed">Luna</text><text x="528" y="256" font-size="11" fill="#a5b2c2">küçük işler + belgeler</text>
   </g>
   <text x="316" y="303" text-anchor="middle" font-size="10" letter-spacing="2" fill="#738496">PLAN → GÖREVLER → DOĞRULAMA → RAPOR</text>
  </g>
 </g>
</svg>
